version: '3.8'

services:
  # The Python Flask Web Application Container
  web:
    build: ./web
    ports:
      - "5007:5007"
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=secretpassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=appdb
    depends_on:
      - db
    restart: unless-stopped

  # The Backend Database Container (Remains unchanged)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  pgdata: