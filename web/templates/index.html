<!DOCTYPE html>
<html>
<head>
    <title>Docker Compose App (Flask)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; text-align: center; }
        input, button { padding: 10px; font-size: 16px; margin: 5px; }
        #messages { margin-top: 20px; list-style-type: none; padding: 0; }
        li { background: #f4f4f4; margin: 5px; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Multi-Container App</h1>
    <p>Python/Flask connected to PostgreSQL</p>

    <input type="text" id="msgInput" placeholder="Enter a message...">
    <button onclick="sendMessage()">Save to DB</button>

    <ul id="messages"></ul>

    <script>
        async function fetchMessages() {
            const res = await fetch('/api/messages');
            const data = await res.json();
            const list = document.getElementById('messages');
            list.innerHTML = '';
            data.forEach(msg => {
                list.innerHTML += `<li>${msg.text}</li>`;
            });
        }

        async function sendMessage() {
            const input = document.getElementById('msgInput');
            if(!input.value) return;

            await fetch('/api/messages', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: input.value })
            });

            input.value = '';
            fetchMessages();
        }

        fetchMessages();
    </script>
</body>
</html>
